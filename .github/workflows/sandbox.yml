name: sandbox journal

# Every 2 hours: read the bot's real trades from the MyFundedPerps sandbox and rebuild the journal
# website. Needs the repository secret FP_API_KEY. Railway ignores these commits (railway.json).
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

concurrency:
  group: journal-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FP_API_KEY: ${{ secrets.FP_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m friendsbot sandbox
      - run: python -m friendsbot site
      - name: Commit
        run: |
          git config user.name "friendsbot"
          git config user.email "friendsbot@users.noreply.github.com"
          git add reports/live/sandbox.json website/index.html
          git diff --cached --quiet || git commit -m "Update sandbox journal $(date -u +'%F %H:%M')"
          git pull --rebase --autostash && git push
